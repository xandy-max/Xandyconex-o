<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa - Desenvolvimento de Sistemas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header>
            <h1>🚀 Pesquisa - Desenvolvimento de Sistemas</h1>
            <p>Queremos saber sua opinião sobre os projetos apresentados.</p>
        </header>

        <form>

            <!-- DADOS -->
            <section>
                <h2>👨‍🚀 Sobre você</h2>

                <label>Nome:</label>
                <input type="text" placeholder="Digite seu nome">

                <label>Turma:</label>
                <input type="text" placeholder="Digite sua turma">
            </section>

            <!-- SITE -->
            <section>
                <h2>🚀 Grupo 1 - Site</h2>

                <label>O que você achou do site e o que mais gostou?</label>
                <textarea placeholder="Digite sua resposta"></textarea>

                <label>Qual nota você daria ao site?</label>
                <select>
                    <option>Selecione</option>
                    <option>1 - Muito ruim</option>
                    <option>2 - Ruim</option>
                    <option>3 - Regular</option>
                    <option>4 - Bom</option>
                    <option>5 - Excelente</option>
                </select>
            </section>

            <!-- PROJETO -->
            <section>
                <h2>🛠️ Grupo 2 - Projeto</h2>

                <label>O que você achou do projeto e o que mais gostou?</label>
                <textarea placeholder="Digite sua resposta"></textarea>

                <label>Qual nota você daria ao projeto?</label>
                <select>
                    <option>Selecione</option>
                    <option>1 - Muito ruim</option>
                    <option>2 - Ruim</option>
                    <option>3 - Regular</option>
                    <option>4 - Bom</option>
                    <option>5 - Excelente</option>
                </select>
            </section>

            <!-- IA -->
            <section>
                <h2>🤖 Grupo 3 - Aplicativo com IA</h2>

                <label>O que você achou do aplicativo e da IA?</label>
                <textarea placeholder="Digite sua resposta"></textarea>

                <label>Você usaria esse aplicativo para estudar?</label>
                <div class="opcoes">
                    <label>
                        <input type="radio" name="ia" value="sim">
                        Sim
                    </label>

                    <label>
                        <input type="radio" name="ia" value="talvez">
                        Talvez
                    </label>

                    <label>
                        <input type="radio" name="ia" value="nao">
                        Não
                    </label>
                </div>
            </section>

            <!-- JOGOS -->
            <section>
                <h2>🎮 Grupo 4 - Jogos</h2>

                <label>O que você achou dos jogos e o que mais gostou?</label>
                <textarea placeholder="Digite sua resposta"></textarea>

                <label>Você jogaria algum dos jogos?</label>
                <div class="opcoes">
                    <label>
                        <input type="radio" name="jogos" value="sim">
                        Sim
                    </label>

                    <label>
                        <input type="radio" name="jogos" value="talvez">
                        Talvez
                    </label>

                    <label>
                        <input type="radio" name="jogos" value="nao">
                        Não
                    </label>
                </div>
            </section>

            <!-- OPINIÃO FINAL -->
            <section>
                <h2>⭐ Opinião Final</h2>

                <label>Qual trabalho chamou mais sua atenção?</label>
                <select>
                    <option>Selecione</option>
                    <option>Site</option>
                    <option>Projeto</option>
                    <option>Aplicativo com IA</option>
                    <option>Jogos</option>
                </select>

                <label>Você tem alguma sugestão para melhorar os projetos?</label>
                <textarea placeholder="Digite sua sugestão"></textarea>
            </section>

            <button type="submit">ENVIAR PESQUISA 🚀</button>

        </form>

        <footer>
            <p>Que a Força esteja com você! ✨</p>
        </footer>

    </main>

</body>
</html>
