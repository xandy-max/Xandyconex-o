<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pesquisa - Desenvolvimento de Sistemas</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header class="cabecalho">
            <h1>Pesquisa - Desenvolvimento de Sistemas</h1>

            <p>
                Queremos saber a sua opinião sobre os projetos apresentados.
            </p>
        </header>

        <form action="#" method="post">

            <!-- DADOS DO ALUNO -->
            <section class="bloco">

                <h2>👨‍🚀 Sobre você</h2>

                <label for="nome">Nome:</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome"
                >

                <label for="turma">Turma:</label>
                <input
                    type="text"
                    id="turma"
                    name="turma"
                    placeholder="Digite sua turma"
                >

            </section>


            <!-- GRUPO 1 -->
            <section class="bloco">

                <h2>🚀 Grupo 1 - Site</h2>

                <label for="opiniao-site">
                    O que você achou do site?
                </label>

                <textarea
                    id="opiniao-site"
                    name="opiniao-site"
                    placeholder="Digite sua resposta..."
                ></textarea>


                <label for="gostou-site">
                    O que você mais gostou?
                </label>

                <textarea
                    id="gostou-site"
                    name="gostou-site"
                    placeholder="Digite sua resposta..."
                ></textarea>


                <label for="interessante-site">
                    O que você achou mais interessante?
                </label>

                <textarea
                    id="interessante-site"
                    name="interessante-site"
                    placeholder="Digite sua resposta..."
                ></textarea>


                <label for="nota-site">
                    De 1 a 5, qual nota você daria para o site?
                </label>

                <select id="nota-site" name="nota-site">

                    <option value="">Selecione uma nota</option>
                    <option value="1">1 - Muito ruim</option>
                    <option value="2">2 - Ruim</option>
                    <option value="3">3 - Regular</option>
                    <option value="4">4 - Bom</option>
                    <option value="5">5 - Excelente</option>

                </select>

            </section>


            <!-- GRUPO 2 -->
            <section class="bloco">

                <h2>🛠️ Grupo 2 - Projeto</h2>

                <label for="opiniao-projeto">
                    O que você achou do projeto?
                </label>

                <textarea
                    id="opiniao-projeto"
                    name="opiniao-projeto"
                    placeholder="Digite sua resposta..."
                ></textarea>


                <label for="gostou-projeto">
                    O que você mais gostou?
                </label>

                <textarea
                    id="gostou-projeto"
                    name="gostou-projeto"
                    placeholder="Digite sua resposta..."
                ></textarea>


                <label for="interessante-projeto">
                    O que você achou mais interessante?
                </label>

                <textarea
                    id="interessante-projeto"
                    name="interessante-projeto"
                    placeholder="Digite sua resposta..."
                ></textarea>


                <label for="nota-projeto">
                    De 1 a 5, qual nota você daria para o projeto?
                </label>

                <select id="nota-projeto" name="nota-projeto">

                    <option value="">Selecione uma nota</option>
                    <option value="1">1 - Muito ruim</option>
                    <option value="2">2 - Ruim</option>
                    <option value="3">3 - Regular</option>
                    <option value="4">4 - Bom</option>
                    <option value="5">5 - Excelente</option>

                </select>

            </section>


            <!-- GRUPO 3 -->
            <section class="bloco">

                <h2>🤖 Grupo 3 - Aplicativo de Estudos com IA</h2>

                <label for="opiniao-app">
                    O que você achou do aplicativo?
                </label>

                <textarea
                    id="opiniao-app"
                    name="opiniao-app"
                    placeholder="Digite sua resposta..."
                ></textarea>


                <label for="gostou-app">
                    O que você mais gostou no aplicativo?
                </label>

                <textarea
                    id="gostou-app"
                    name="gostou-app"
                    placeholder="Digite sua resposta..."
                ></textarea>


                <label for="interessante-app">
                    O que você achou mais interessante na IA?
                </label>

                <textarea
                    id="interessante-app"
                    name="interessante-app"
                    placeholder="Digite sua resposta..."
                ></textarea>


                <label>
                    Você utilizaria esse aplicativo para estudar?
                </label>

                <div class="opcoes">

                    <label>
                        <input
                            type="radio"
                            name="usaria-app"
                            value="sim"
                        >
                        Sim
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="usaria-app"
                            value="talvez"
                        >
                        Talvez
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="usaria-app"
                            value="nao"
                        >
                        Não
                    </label>

                </div>


                <label for="nota-app">
                    De 1 a 5, qual nota você daria para o aplicativo?
                </label>

                <select id="nota-app" name="nota-app">

                    <option value="">Selecione uma nota</option>
                    <option value="1">1 - Muito ruim</option>
                    <option value="2">2 - Ruim</option>
                    <option value="3">3 - Regular</option>
                    <option value="4">4 - Bom</option>
                    <option value="5">5 - Excelente</option>

                </select>

            </section>


            <!-- GRUPO 4 -->
            <section class="bloco">

                <h2>🎮 Grupo 4 - Jogos para Consoles</h2>

                <label for="opiniao-jogos">
                    O que você achou dos jogos?
                </label>

                <textarea
                    id="opiniao-jogos"
                    name="opiniao-jogos"
                    placeholder="Digite sua resposta..."
                ></textarea>


                <label for="gostou-jogos">
                    O que você mais gostou nos jogos?
                </label>

                <textarea
                    id="gostou-jogos"
                    name="gostou-jogos"
                    placeholder="Digite sua resposta..."
                ></textarea>


                <label for="interessante-jogos">
                    O que você achou mais interessante?
                </label>

                <textarea
                    id="interessante-jogos"
                    name="interessante-jogos"
                    placeholder="Digite sua resposta..."
                ></textarea>


                <label>
                    Você jogaria algum dos jogos apresentados?
                </label>

                <div class="opcoes">

                    <label>
                        <input
                            type="radio"
                            name="jogaria"
                            value="sim"
                        >
                        Sim
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="jogaria"
                            value="talvez"
                        >
                        Talvez
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="jogaria"
                            value="nao"
                        >
                        Não
                    </label>

                </div>


                <label for="nota-jogos">
                    De 1 a 5, qual nota você daria para os jogos?
                </label>

                <select id="nota-jogos" name="nota-jogos">

                    <option value="">Selecione uma nota</option>
                    <option value="1">1 - Muito ruim</option>
                    <option value="2">2 - Ruim</option>
                    <option value="3">3 - Regular</option>
                    <option value="4">4 - Bom</option>
                    <option value="5">5 - Excelente</option>

                </select>

            </section>


            <!-- OPINIÃO FINAL -->
            <section class="bloco">

                <h2>⭐ Opinião Final</h2>

                <label for="favorito">
                    Qual dos trabalhos chamou mais sua atenção?
                </label>

                <select id="favorito" name="favorito">

                    <option value="">Selecione uma opção</option>
                    <option value="site">Site</option>
                    <option value="projeto">Projeto</option>
                    <option value="app">Aplicativo com IA</option>
                    <option value="jogos">Jogos</option>

                </select>


                <label for="sugestoes">
                    Você tem alguma sugestão para melhorar os projetos?
                </label>

                <textarea
                    id="sugestoes"
                    name="sugestoes"
                    placeholder="Digite sua sugestão..."
                ></textarea>


                <label for="comentario">
                    Deixe um comentário final:
                </label>

                <textarea
                    id="comentario"
                    name="comentario"
                    placeholder="Digite seu comentário..."
                ></textarea>

            </section>


            <button type="submit">
                ENVIAR PESQUISA
            </button>

        </form>


        <footer>
            <p>Que a Força esteja com você! ✨</p>
        </footer>

    </main>

</body>

</html>
